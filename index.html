<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101216">
  <meta name="description" content="Study Hall student portal.">
  <title>STUDY HALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261029-study-cover">
  <style>
    :root{--school-bg:#101216;--school-ink:#e5e7e9;--school-muted:#8e939a;--school-line:#30343a}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#272b31 0,#171a1f 32%,#101216 75%);color:var(--school-ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid rgba(208,214,222,.1);border-radius:50%;width:min(70vw,780px);height:min(70vw,780px);left:50%;top:48%;transform:translate(-50%,-50%)}body:after{width:min(52vw,570px);height:min(52vw,570px);border-color:rgba(208,214,222,.07)}
    .school-page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}.school-header,.school-footer{display:flex;align-items:center;justify-content:space-between;padding:28px 7vw;color:#a8adb4;font:9px 'DM Mono',monospace;letter-spacing:.17em}.school-brand{display:flex;align-items:center;gap:11px;color:#e1e3e6}.school-mark{width:29px;height:29px;border:1px solid #bfc4cb;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#e9ebed,#696e75 66%,#24272d);color:#131519;font:700 16px Arial,sans-serif;box-shadow:0 0 20px #d3d9e222}.school-status{display:flex;align-items:center;gap:9px}.school-status:before{content:"";width:5px;height:5px;border-radius:50%;background:#bfc5cc;box-shadow:0 0 10px #d5d9de}
    .school-main{flex:1;display:grid;place-items:center;text-align:center;padding:45px 22px 76px}.school-content{max-width:720px}.school-eyebrow{margin:0 0 24px;color:#acb1b8;font:9px 'DM Mono',monospace;letter-spacing:.24em}.school-title{margin:0;color:#e8eaed;font-size:clamp(70px,14vw,150px);line-height:.78;letter-spacing:-.085em;font-weight:800;text-shadow:0 10px 45px #0008}.school-title span{display:block;color:#aeb4bc}.school-subtitle{max-width:440px;margin:28px auto 30px;color:#a7abb2;font-size:14px;line-height:1.7}.homework-button{display:inline-flex;align-items:center;gap:34px;min-height:52px;padding:0 20px;background:linear-gradient(145deg,#e1e4e8,#9298a0);color:#15171b;border:1px solid #f0f2f4;font:700 10px 'DM Mono',monospace;letter-spacing:.13em;box-shadow:0 10px 35px #0007;transition:transform .2s,box-shadow .2s}.homework-button:hover{transform:translateY(-3px);box-shadow:0 14px 44px #c9cdd522}.homework-button span{font-size:18px}.school-hint{margin:18px 0 0;color:#7e838a;font:8px 'DM Mono',monospace;letter-spacing:.16em}.school-footer{border-top:1px solid var(--school-line);font-size:8px}.school-footer a{color:#aeb4bc}.school-footer a:hover{color:#fff}
    @media(max-width:600px){.school-header,.school-footer{padding:20px 6vw}.school-main{padding:40px 7vw 60px}.school-title{font-size:clamp(68px,20vw,112px)}.school-subtitle{font-size:13px}}
  </style>
</head>
<body>
  <div class="school-page">
    <header class="school-header"><div class="school-brand"><span class="school-mark">S</span><span>STUDY HALL</span></div><span class="school-status">STUDENT PORTAL</span></header>
    <main class="school-main"><div class="school-content"><p class="school-eyebrow">FOCUS · LEARN · RESET</p><h1 class="school-title">STUDY<span>HALL</span></h1><p class="school-subtitle">A quiet space for your school day, your next assignment, and a little time to reset.</p><a class="homework-button" href="chrome.html">HOMEWORK <span>↗</span></a><p class="school-hint">OPEN YOUR PERSONAL PORTAL</p></div></main>
    <footer class="school-footer"><span>STUDY HALL · STUDENT PORTAL</span><a href="#top">BACK TO TOP ↑</a></footer>
  </div>
</body>
</html>
